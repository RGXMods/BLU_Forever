variables:
  GITHUB_MIRROR_REPOSITORY: RGXMods/BLU_Forever

include:
  - project: rgxmods/warcraft/RGX-Framework
    ref: main
    file: /.gitlab/ci/addon.yml

stages:
  - validate
  - test
  - contract
  - mirror

# Every BLU_Forever test, under Lua 5.1 from the repository root.
test:blu-forever:
  stage: test
  image: alpine:3.20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: on_success
  script:
    - apk add --no-cache lua5.1 git
    - git clone --depth 1 https://github.com/RGXMods/RGX-Framework.git ../RGX-Framework
    - |
      for t in tests/*-test.lua; do
        echo "test $t"
        RGXFW_PATH=../RGX-Framework lua5.1 "$t" || exit 1
      done
